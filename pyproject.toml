[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neko-data"
version = "0.1.1"
description = "Streaming WebDataset and metadata tooling for diffusion model training."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "NekoDiffusion contributors" }]
dependencies = [
    "filelock>=3.12",
    "numpy>=1.24",
    "Pillow>=9.0",
    "pyarrow>=12.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
hf = [
    "datasets>=2.14",
    "huggingface_hub>=0.20",
    "requests>=2.31",
]
duckdb = ["duckdb>=0.9"]
r2 = ["boto3>=1.28"]
rainbow = ["rainbowneko"]
dev = [
    "mypy>=1.8",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "yapf>=0.40",
]

[project.scripts]
neko-data = "neko_data.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.yapf]
based_on_style = "pep8"
column_limit = 120
coalesce_brackets = true

